<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07389c" />
      <stop offset="100%" stop-color="#052c7e" />
    </linearGradient>
    <linearGradient id="mHeadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#256bf5" />
      <stop offset="100%" stop-color="#1856c9" />
    </linearGradient>
    <linearGradient id="mBookRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="mBookLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e64db" />
      <stop offset="100%" stop-color="#154cb0" />
    </linearGradient>
    <clipPath id="mLeftEyeClip">
      <ellipse cx="195" cy="245" rx="55" ry="42" />
    </clipPath>
    <clipPath id="mRightEyeClip">
      <ellipse cx="317" cy="245" rx="55" ry="42" />
    </clipPath>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#mBgGrad)" />

  <!-- Content scaled into central 80% safe zone -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- React Atom Symbol above Head -->
    <g transform="translate(256, 95)" stroke="#38bdf8" stroke-width="5.5" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="9" fill="#38bdf8" stroke="none" />
      <ellipse cx="0" cy="0" rx="44" ry="16" />
      <ellipse cx="0" cy="0" rx="44" ry="16" transform="rotate(60)" />
      <ellipse cx="0" cy="0" rx="44" ry="16" transform="rotate(-60)" />
    </g>

    <!-- Owl Head / Body -->
    <circle cx="256" cy="256" r="112" fill="url(#mHeadGrad)" />

    <!-- Eyes Background -->
    <ellipse cx="195" cy="246" rx="54" ry="40" fill="#ffffff" />
    <ellipse cx="317" cy="246" rx="54" ry="40" fill="#ffffff" />

    <!-- Left Eye: Pupil & Eyelid -->
    <g clip-path="url(#mLeftEyeClip)">
      <rect x="175" y="222" width="38" height="42" rx="16" fill="#0b172a" />
      <path d="M 130 200 L 260 200 L 260 234 Q 195 238 130 234 Z" fill="url(#mHeadGrad)" />
    </g>

    <!-- Right Eye: Pupil & Eyelid -->
    <g clip-path="url(#mRightEyeClip)">
      <rect x="299" y="222" width="38" height="42" rx="16" fill="#0b172a" />
      <path d="M 250 200 L 380 200 L 380 234 Q 317 238 250 234 Z" fill="url(#mHeadGrad)" />
    </g>

    <!-- Beak -->
    <ellipse cx="256" cy="272" rx="27" ry="20" fill="#f97316" />
    <path d="M 243 277 Q 256 287 269 277" stroke="#c2410c" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Book Container -->
    <path d="M 160 316 Q 206 332 256 334 Q 306 332 352 316 Q 306 322 256 324 Q 206 322 160 316 Z" fill="#ffffff" />
    <path d="M 165 318 C 190 300 235 320 256 333 C 277 320 322 300 347 318 L 347 330 C 322 312 277 332 256 345 C 235 332 190 312 165 330 Z" fill="#f1f5f9" />
    <path d="M 164 326 L 250 338 L 250 436 L 164 420 Z" fill="url(#mBookLeft)" rx="4" />
    <path d="M 250 338 L 262 338 L 262 438 L 250 436 Z" fill="#ea580c" />
    <path d="M 262 338 L 348 326 L 348 420 L 262 438 Z" fill="url(#mBookRight)" />
    <rect x="284" y="365" width="48" height="28" rx="8" fill="#78350f" />
  </g>
</svg>
